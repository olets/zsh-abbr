name: Package release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out release and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Package source
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Unsupported version tag: $RELEASE_TAG" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/v${version}.tar.gz"
          tar --exclude='.git' -czf "$archive" -C "$GITHUB_WORKSPACE" .
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub stores tag assets on releases. Using GITHUB_TOKEN here
          # does not trigger the separate release/Homebrew workflow.
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" --clobber
